<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angle Measurement Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas {
            border: 2px solid #444;
            cursor: crosshair;
            background: #2a2a2a;
        }
        #canvas.no-image {
            cursor: pointer;
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 280px;
            font-size: 13px;
        }
        #angle-display {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 120, 215, 0.9);
            padding: 15px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
        #upload-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 120, 215, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        #upload-btn:hover {
            background: rgba(0, 140, 255, 1);
        }
        #file-input {
            display: none;
        }
        #placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            pointer-events: none;
            user-select: none;
        }
        #placeholder.hidden {
            display: none;
        }
        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }
        .upload-icon svg {
            width: 100%;
            height: 100%;
        }
        .upload-text {
            font-size: 20px;
            margin-bottom: 10px;
            color: #aaa;
        }
        .upload-subtext {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="instructions">
            <strong>How to measure:</strong><br>
            • Click 3 points to form an angle<br>
            • Hold Shift to snap to 5°<br>
            <br>
            <strong>Controls:</strong><br>
            Backspace - Remove last point<br>
            ESC - Clear all points
        </div>
        <div id="angle-display"></div>
        <canvas id="canvas" class="no-image"></canvas>
        <div id="placeholder">
            <div class="upload-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Image frame -->
                    <rect x="10" y="20" width="80" height="60" fill="none" stroke="#888" stroke-width="3" rx="3"/>
                    <!-- Mountain/landscape -->
                    <polyline points="10,65 30,45 50,55 70,35 90,50 90,80 10,80" fill="#666" stroke="none"/>
                    <!-- Sun/circle -->
                    <circle cx="30" cy="35" r="8" fill="#888"/>
                </svg>
            </div>
            <div class="upload-text">Click to upload image</div>
            <div class="upload-subtext">or paste with Ctrl/Cmd+V</div>
        </div>
        <input type="file" id="file-input" accept="image/*">
        <button id="upload-btn">Upload Image</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const angleDisplay = document.getElementById('angle-display');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const placeholder = document.getElementById('placeholder');

        let image = null;
        let anchors = [];
        let mousePos = { x: 0, y: 0, shiftKey: false };
        let imageOffset = { x: 0, y: 0 };

        // Set canvas size based on window size
        function resizeCanvas() {
            // Smoothly transition margin from 5% on small screens to 10% on large screens
            const smallScreen = 600;
            const largeScreen = 1400;

            // Use the larger dimension to determine margin percentage
            const screenSize = Math.max(window.innerWidth, window.innerHeight);
            const sizeFactor = Math.max(0, Math.min(1,
                (screenSize - smallScreen) / (largeScreen - smallScreen)
            ));
            const marginPercent = 0.05 + sizeFactor * 0.05;

            const marginX = Math.max(window.innerWidth * marginPercent, 10);
            const marginY = Math.max(window.innerHeight * marginPercent, 10);

            const maxWidth = window.innerWidth - marginX * 2;
            const maxHeight = window.innerHeight - marginY * 2;

            // Smooth aspect ratio between 2/3 and 3/2
            const screenAspectRatio = maxWidth / maxHeight;
            const minAspect = 2 / 3;
            const maxAspect = 3 / 2;
            const aspectRatio = Math.max(minAspect, Math.min(maxAspect, screenAspectRatio));

            let width = maxWidth;
            let height = width / aspectRatio;

            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }

            canvas.width = width;
            canvas.height = height;

            // Redraw if image exists
            if (image) {
                const scaleX = canvas.width / image.width;
                const scaleY = canvas.height / image.height;
                const scale = Math.min(scaleX, scaleY);

                const scaledWidth = image.width * scale;
                const scaledHeight = image.height * scale;

                imageOffset.x = (canvas.width - scaledWidth) / 2;
                imageOffset.y = (canvas.height - scaledHeight) / 2;
                imageOffset.scale = scale;

                draw();
            }
        }

        // Initial resize
        resizeCanvas();

        // Resize on window resize
        window.addEventListener('resize', resizeCanvas);

        // Function to load an image
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    image = img;

                    // Calculate scale to fit image to canvas
                    const scaleX = canvas.width / img.width;
                    const scaleY = canvas.height / img.height;
                    const scale = Math.min(scaleX, scaleY);

                    // Calculate scaled dimensions
                    const scaledWidth = img.width * scale;
                    const scaledHeight = img.height * scale;

                    // Center the scaled image
                    imageOffset.x = (canvas.width - scaledWidth) / 2;
                    imageOffset.y = (canvas.height - scaledHeight) / 2;
                    imageOffset.scale = scale;

                    anchors = [];
                    placeholder.classList.add('hidden');
                    canvas.classList.remove('no-image');
                    draw();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Handle upload button click
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        // Handle paste event
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const blob = item.getAsFile();
                    loadImage(blob);
                    break;
                }
            }
        });

        // Track mouse position
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
            mousePos.shiftKey = e.shiftKey;
            if (image && anchors.length > 0 && anchors.length < 3) {
                draw();
            }
        });

        // Handle clicks
        canvas.addEventListener('click', (e) => {
            if (!image) {
                fileInput.click();
                return;
            }

            const rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            if (anchors.length === 3) {
                // Restart process if all three anchors are already set
                anchors = [];
                angleDisplay.style.display = 'none';
            }

            // Apply snapping if shift is pressed and we have a previous anchor
            if (anchors.length > 0) {
                const snapped = snapToAngle(anchors[anchors.length - 1], { x, y }, e.shiftKey);
                x = snapped.x;
                y = snapped.y;
            }

            anchors.push({ x, y });

            if (anchors.length === 3) {
                calculateAngle();
            }

            draw();
        });

        // Handle keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                e.preventDefault();
                if (anchors.length > 0) {
                    anchors.pop();
                    if (anchors.length < 3) {
                        angleDisplay.style.display = 'none';
                    }
                    draw();
                }
            } else if (e.key === 'Escape') {
                e.preventDefault();
                if (anchors.length > 0) {
                    anchors = [];
                    angleDisplay.style.display = 'none';
                    draw();
                }
            }
        });

        // Snap position to nearest 5-degree angle from anchor
        function snapToAngle(anchor, target, shiftKey) {
            if (!shiftKey) return target;

            const dx = target.x - anchor.x;
            const dy = target.y - anchor.y;

            // Calculate angle in radians (atan2 gives angle from positive x-axis)
            const angle = Math.atan2(dy, dx);

            // Convert to degrees
            const angleDeg = angle * (180 / Math.PI);

            // Snap to nearest 5 degrees
            const snappedAngleDeg = Math.round(angleDeg / 5) * 5;

            // Convert back to radians
            const snappedAngle = snappedAngleDeg * (Math.PI / 180);

            // Calculate distance
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Calculate new position
            return {
                x: anchor.x + Math.cos(snappedAngle) * distance,
                y: anchor.y + Math.sin(snappedAngle) * distance
            };
        }

        // Calculate angle between three points
        function calculateAngle() {
            if (anchors.length !== 3) return;

            const [p1, p2, p3] = anchors;

            // Vectors from p2 to p1 and p2 to p3
            const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
            const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };

            // Dot product
            const dot = v1.x * v2.x + v1.y * v2.y;

            // Magnitudes
            const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
            const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);

            // Angle in radians, then convert to degrees
            const angleRad = Math.acos(dot / (mag1 * mag2));
            const angleDeg = angleRad * (180 / Math.PI);

            // Display angle
            angleDisplay.textContent = `Angle: ${angleDeg.toFixed(2)}°`;
            angleDisplay.style.display = 'block';
        }

        // Draw everything
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw image
            if (image) {
                const scale = imageOffset.scale || 1;
                ctx.drawImage(
                    image,
                    imageOffset.x,
                    imageOffset.y,
                    image.width * scale,
                    image.height * scale
                );
            }

            // Draw anchors and lines
            if (anchors.length > 0) {
                // Draw line from first anchor to mouse (if only 1 anchor)
                if (anchors.length === 1) {
                    const targetPos = snapToAngle(anchors[0], mousePos, mousePos.shiftKey);
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(anchors[0].x, anchors[0].y);
                    ctx.lineTo(targetPos.x, targetPos.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Draw line from second anchor to mouse (if 2 anchors)
                if (anchors.length === 2) {
                    // Line from anchor 1 to anchor 2
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(anchors[0].x, anchors[0].y);
                    ctx.lineTo(anchors[1].x, anchors[1].y);
                    ctx.stroke();

                    // Line from anchor 2 to mouse
                    const targetPos = snapToAngle(anchors[1], mousePos, mousePos.shiftKey);
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(anchors[1].x, anchors[1].y);
                    ctx.lineTo(targetPos.x, targetPos.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Draw all lines if 3 anchors
                if (anchors.length === 3) {
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(anchors[0].x, anchors[0].y);
                    ctx.lineTo(anchors[1].x, anchors[1].y);
                    ctx.lineTo(anchors[2].x, anchors[2].y);
                    ctx.stroke();
                }

                // Draw anchor points
                anchors.forEach((anchor, index) => {
                    ctx.fillStyle = index === 1 ? '#ff0000' : '#00ff00';
                    ctx.beginPath();
                    ctx.arc(anchor.x, anchor.y, 6, 0, Math.PI * 2);
                    ctx.fill();

                    // Draw anchor label
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px Arial';
                    ctx.fillText(`${index + 1}`, anchor.x + 10, anchor.y - 10);
                });
            }
        }

        // Initial draw
        draw();
    </script>
</body>
</html>
